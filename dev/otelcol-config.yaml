# Extra otelcol-contrib configuration loaded alongside the built-in LGTM config.
# Loaded via OTELCOL_EXTRA_ARGS="--config=file:/etc/otelcol/extra.yaml".
# Verified against otelcol-contrib 0.147.0 (grafana/otel-lgtm:latest).
# otelcol configs have no top-level version field.
#
# Adds:
#   • health_check extension on :13133
#   • logs/make  — filelog receiver tailing dev/logs/*.log → Loki
#   • traces/spanmetrics — fan-out from the built-in otlp receiver, generates RED metrics
#   • metrics/spanmetrics — spanmetrics connector output → Prometheus
#   • service.telemetry.logs — otelcol writes its own structured logs to /dev/logs/otelcol.log
#     which the filelog/make receiver then ingests (*.log glob covers it automatically)
#   • service.telemetry.metrics.level: detailed — full otelcol self-metrics at :8888

# Loki default limits (limits_config) that govern what this collector may push:
#   max_label_names_per_series: 15
#   max_label_name_length:      1024
#   max_label_value_length:     2048
# The transform processor below enforces the value-length and count limits before
# the push so that oversized attributes are truncated rather than causing the
# whole batch to be rejected with a 400.

# ── Receivers ─────────────────────────────────────────────────────────────────

receivers:
  # Explicit OTLP receiver declaration — mirrors the built-in config endpoints.
  # Declaring it here makes the extra config self-documenting and allows the
  # traces/spanmetrics pipeline to reference it without relying on implicit
  # merge ordering from the built-in config.
  # otelcol merges map keys: same endpoints win, one receiver instance is created.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Tails all log files written by make recipes (and otelcol itself — see
  # service.telemetry.logs below which writes to /dev/logs/otelcol.log).
  filelog/logfiles:
    include:
      - /dev/logs/*.log
    start_at: end
    poll_interval: 2s
    include_file_name: true
    include_file_path: false
    fingerprint_size: 5kb
# ── Processors ────────────────────────────────────────────────────────────────

processors:
  transform:
    log_statements:
      - context: log
        statements:
          # Populate service.name from the log file name when not already set.
          - set(resource.attributes["service.name"], attributes["log.file.name"]) where resource.attributes["service.name"] == nil
          # Truncate log-record attribute values that exceed Loki's max_label_value_length (2048).
          # Long values (e.g. full log lines captured as attributes) cause the whole batch to be
          # rejected with a 400; truncate instead of dropping so the key is preserved.
          - truncate_all(attributes, 2048)
          # Cap log-record attributes at Loki's max_label_names_per_series (15), keeping the file name.
          - limit(attributes, 15, ["log.file.name"])
          # Apply the same guards to resource attributes forwarded as structured metadata.
          - truncate_all(resource.attributes, 2048)
          - limit(resource.attributes, 15, ["service.name"])
  batch:
    timeout: 5s

# ── Exporters ─────────────────────────────────────────────────────────────────

exporters:
  # Loki runs at 127.0.0.1 inside the grafana/otel-lgtm container.
  # Use the explicit IPv4 address — Go resolves "localhost" to [::1] when
  # IPv6 is present, but Loki only binds on 127.0.0.1.
  otlp_http/loki:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
    compression: gzip

  # Expose application + span metrics in Prometheus exposition format.
  # This avoids Prometheus OTLP ingestion rejecting some Codex-emitted metrics
  # with invalid temporality/type combinations.
  prometheus/app:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
    metric_expiration: 2m

  otlp_http/tempo:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
    compression: gzip

# ── Extensions ────────────────────────────────────────────────────────────────

extensions:
  health_check:
    endpoint: 127.0.0.1:13133
    path: /health/status
    check_collector_pipeline:
      enabled: true
      interval: 5m
      exporter_failure_threshold: 5

# ── Service ───────────────────────────────────────────────────────────────────

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
      encoding: json
      # Write structured logs to /dev/logs/otelcol.log so filelog/make picks
      # them up (the *.log glob covers this file automatically).
      output_paths:
        - /dev/logs/otelcol.log
        - stdout
    metrics:
      # detailed exposes all available self-metrics at :8888/metrics,
      # which Prometheus scrapes via the scrape_configs in prometheus.yaml.
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    logs/make:
      receivers: [filelog/logfiles, otlp]
      processors: [transform, batch]
      exporters: [otlp_http/loki]
    traces/spans:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/tempo]
    metrics/spanmetrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus/app]

---
services:
  k6:
    image: ${K6_IMAGE:-make-mcp-k6:local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./integration/k6:/scripts:ro
      - ./tmp:/tmp/k6-results
    environment:
      MCP_BASE_URL: "http://host.docker.internal:9378/mcp"
      K6_OUT: ${K6_OUT:-}
      K6_OTEL_GRPC_EXPORTER_ENDPOINT: ${K6_OTEL_GRPC_EXPORTER_ENDPOINT:-}
      K6_OTEL_GRPC_EXPORTER_INSECURE: ${K6_OTEL_GRPC_EXPORTER_INSECURE:-true}
      K6_OTEL_SERVICE_NAME: ${K6_OTEL_SERVICE_NAME:-make-mcp-integration}
    command:
      - run
      - --out
      - json=/tmp/k6-results/summary.json
      - ${K6_SCRIPT:-/scripts/integration.js}

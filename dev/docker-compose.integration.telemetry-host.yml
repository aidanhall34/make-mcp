---
services:
  make-mcp-server:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      # Explicit service name so server spans are filterable separately from k6 metrics.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-make-mcp-server}
      # Short export interval ensures metrics flush before the container exits.
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-2000}
      # Resource attributes tag every span and metric with the test context.
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-test.type=integration}

  k6:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - run
      - --out
      - json=/tmp/k6-results/summary.json
      - --out
      - opentelemetry
      - ${K6_SCRIPT:-/scripts/integration.js}
    environment:
      K6_OTEL_GRPC_EXPORTER_ENDPOINT: ${K6_OTEL_GRPC_EXPORTER_ENDPOINT:-host.docker.internal:4317}
      K6_OTEL_GRPC_EXPORTER_INSECURE: ${K6_OTEL_GRPC_EXPORTER_INSECURE:-true}
      # Distinct service name so k6 metrics are filterable separately from server spans.
      K6_OTEL_SERVICE_NAME: ${K6_OTEL_SERVICE_NAME:-make-mcp-k6}
      # Export every second so metrics arrive even in short functional test runs.
      K6_OTEL_EXPORT_INTERVAL: ${K6_OTEL_EXPORT_INTERVAL:-1s}
      K6_OTEL_FLUSH_INTERVAL: ${K6_OTEL_FLUSH_INTERVAL:-1s}

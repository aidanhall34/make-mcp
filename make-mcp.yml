# make-mcp configuration
# All options here have equivalent CLI flags in cmd/validate.
# CLI flags always take precedence over this file.

# delimiter: the literal string that must appear between # and the annotation key.
# The annotation format is:  .*#<delimiter> <key>: <value>
# Default: "@"
delimiter: "@"

# makefiles: ordered list of Makefile paths to parse.
# Paths are relative to the working directory where the tool is run.
makefiles:
  - ./makefile

# strict: require every supported recipe annotation.
# When true, optional MCP tool hints (read-only, destructive, idempotent,
# open-world) must be declared on every annotated recipe.
strict: false

# transport: MCP transport to enable.
# One of: stdio, http, both
# Default: "stdio"
transport: "stdio"

# listen: HTTP listen address when transport includes http.
# Default: "127.0.0.1:9378"
listen: "127.0.0.1:9378"

# log_path: destination for JSON logs.
# One of: stderr, or a file path.
# Default: "stderr"
log_path: "stderr"

# debug: enable debug-level logging.
# When true, tool call arguments, stdout, and stderr are included in logs.
# Default: false
debug: false

# timeouts: per-risk execution timeouts for tool invocations.
# Default: 10m for all risk levels.
timeouts:
  low: 10m
  medium: 10m
  high: 10m

# page_size: maximum number of tools or resources returned per page.
# 0 (default) disables pagination.
# page_size: 50

# resources: expose files and directories as MCP resources.
# Clients can read, list, and subscribe to change notifications.
# resources:
#   recursive: true          # default for directory traversal
#   paths:
#     - name: "config"       # used for OAuth group mapping
#       description: "Configuration files"
#       path:
#         - "./config/*.yml"
#         - "./docs/"
#       recursive: false     # overrides top-level default

# oauth: Bearer token authentication via an external OIDC provider.
# Requires transport: http or both. TLS is mandatory when enabled.
# oauth:
#   enabled: false
#   issuer: "https://localhost:8443/realms/make-mcp"
#   audience: "make-mcp"
#   jwks_uri: "https://localhost:8443/realms/make-mcp/protocol/openid-connect/certs"
#   tls:
#     cert: ./dev/certs/server.crt
#     key:  ./dev/certs/server.key
#     ca:   ./dev/certs/ca.crt   # custom CA for validating the JWKS endpoint
#   groups:
#     - name: "/admins"
#       resources:
#         - "config"             # grant /admins access to the "config" resource path

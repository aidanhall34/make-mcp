name: _smoke-tests-container

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      image-tag:
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  container:
    name: smoke-tests (container-${{ inputs.arch }})
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Download container tar artifact
        uses: actions/download-artifact@v4
        with:
          name: container-${{ inputs.arch }}
          path: dist/

      - name: Load container image
        run: docker load -i dist/make-mcp_${{ inputs.image-tag }}_linux_${{ inputs.arch }}.tar

      - name: Re-tag image for local use
        run: |
          docker tag \
            "ghcr.io/aidanhall34/make-mcp:${{ inputs.image-tag }}" \
            "make-mcp-local:${{ inputs.image-tag }}"

      - name: Run container smoke test
        run: |
          make smoke-test-container \
            ARCH=${{ inputs.arch }} \
            IMAGE_TAG="${{ inputs.image-tag }}" \
            IMAGE_NAME=make-mcp-local

      - name: Notify Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "smoke-tests (container-${{ inputs.arch }})"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

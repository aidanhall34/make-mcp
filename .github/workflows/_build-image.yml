name: _build-image

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      image-tag:
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false
      OTEL_EXPORTER_OTLP_ENDPOINT:
        required: false

jobs:
  build:
    name: build-images (${{ inputs.arch }})
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image tar
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: |
          make build-container-tar \
            ARCH=${{ inputs.arch }} \
            IMAGE_TAG="${{ inputs.image-tag }}" \
            OTEL_TEST_ENDPOINT="${OTEL_EXPORTER_OTLP_ENDPOINT}"

      - name: Upload container tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ inputs.arch }}
          path: dist/make-mcp_${{ inputs.image-tag }}_linux_${{ inputs.arch }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "build-images (${{ inputs.arch }})"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

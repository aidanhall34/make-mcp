name: _install-tests

on:
  workflow_call:
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  install-tests:
    name: install-tests
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run install tests
        run: make install

      - name: Verify installation
        run: |
          $(go env GOPATH)/bin/make-mcp --help
          $(go env GOPATH)/bin/make-mcp-validate --config make-mcp.yml

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "install-tests"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

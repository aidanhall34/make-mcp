name: _bench

on:
  workflow_call:
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  benchmarks:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          mkdir -p dev/logs
          make bench 2>&1 | tee dev/logs/bench.log

      - name: Upload benchmarks log
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-log
          path: dev/logs/bench.log
          retention-days: 7

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "bench"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

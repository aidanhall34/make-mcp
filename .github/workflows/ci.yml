name: CI

on:
  push:

# OTLP telemetry is forwarded to the configured collector from every job.
# Tools that honour these variables (Docker BuildKit, Go test binaries, k6)
# will emit spans and metrics automatically when the endpoint is non-empty.
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_INSECURE: ${{ startsWith(secrets.OTEL_EXPORTER_OTLP_ENDPOINT, 'http://') }}
  OTEL_TRACES_EXPORTER: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT != '' && 'otlp' || 'none' }}
  OTEL_METRICS_EXPORTER: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT != '' && 'otlp' || 'none' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run lint and validation
        run: make lint

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "lint"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure telemetry for ACT
        if: env.ACT == 'true'
        run: |
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=${ACT_OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}" >> "$GITHUB_ENV"
          echo "OTEL_EXPORTER_OTLP_INSECURE=true" >> "$GITHUB_ENV"
          echo "OTEL_TRACES_EXPORTER=otlp" >> "$GITHUB_ENV"
          echo "OTEL_METRICS_EXPORTER=otlp" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: make tests

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "unit-tests"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure telemetry for ACT
        if: env.ACT == 'true'
        run: |
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=${ACT_OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}" >> "$GITHUB_ENV"
          echo "OTEL_EXPORTER_OTLP_INSECURE=true" >> "$GITHUB_ENV"
          echo "OTEL_TRACES_EXPORTER=otlp" >> "$GITHUB_ENV"
          echo "OTEL_METRICS_EXPORTER=otlp" >> "$GITHUB_ENV"

      - name: Build binaries
        run: make build-binaries ARCH=${{ matrix.arch }}

      - name: Build container image tar
        run: |
          make build-container-tar \
            ARCH=${{ matrix.arch }} \
            IMAGE_TAG="ci-${{ github.sha }}" \
            OTEL_TEST_ENDPOINT="${OTEL_EXPORTER_OTLP_ENDPOINT}"

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*_linux_${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload container tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.arch }}
          path: dist/make-mcp_ci-${{ github.sha }}_linux_${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "build (${{ matrix.arch }})"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  integration:
    name: integration (${{ matrix.arch }}, ${{ matrix.test_name }})
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - build
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        test_name: [tools-list, tools-call-hello-world]
        include:
          - test_name: tools-list
            script: tools-list.js
          - test_name: tools-call-hello-world
            script: tools-call-hello-world.js
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Download container tar
        uses: actions/download-artifact@v4
        with:
          name: container-${{ matrix.arch }}
          path: dist/

      - name: Load container image
        run: |
          docker load -i dist/make-mcp_ci-${{ github.sha }}_linux_${{ matrix.arch }}.tar
          docker tag \
            ghcr.io/${{ github.repository_owner }}/make-mcp:ci-${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/make-mcp:ci-${{ github.sha }}-${{ matrix.arch }}

      - name: Configure telemetry for ACT
        if: env.ACT == 'true'
        run: |
          echo "OTEL_EXPORTER_OTLP_ENDPOINT=${ACT_OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}" >> "$GITHUB_ENV"
          echo "OTEL_EXPORTER_OTLP_INSECURE=true" >> "$GITHUB_ENV"
          echo "OTEL_TRACES_EXPORTER=otlp" >> "$GITHUB_ENV"
          echo "OTEL_METRICS_EXPORTER=otlp" >> "$GITHUB_ENV"
          echo "K6_OUT=experimental-opentelemetry" >> "$GITHUB_ENV"
          echo "K6_OTEL_GRPC_EXPORTER_ENDPOINT=${ACT_OTEL_EXPORTER_OTLP_ENDPOINT:-host.docker.internal:4317}" >> "$GITHUB_ENV"
          echo "K6_OTEL_GRPC_EXPORTER_INSECURE=true" >> "$GITHUB_ENV"

      - name: Configure k6 OTLP
        if: env.OTEL_EXPORTER_OTLP_ENDPOINT != ''
        run: |
          grpc="${OTEL_EXPORTER_OTLP_ENDPOINT#http://}"
          grpc="${grpc#https://}"
          echo "K6_OUT=experimental-opentelemetry" >> "$GITHUB_ENV"
          echo "K6_OTEL_GRPC_EXPORTER_ENDPOINT=${grpc}" >> "$GITHUB_ENV"
          echo "K6_OTEL_GRPC_EXPORTER_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE}" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: |
          IMAGE_TAG="ci-${{ github.sha }}-${{ matrix.arch }}" \
          K6_SCRIPT="/scripts/${{ matrix.script }}" \
          make integration-prebuilt

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "integration (${{ matrix.arch }}, ${{ matrix.test_name }})"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - build
      - integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      git_tag: ${{ steps.version.outputs.git_tag }}
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Create semantic version tag and GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release

      - name: Detect created tag
        id: version
        run: |
          git_tag="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -n "${git_tag}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "git_tag=${git_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "git_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "semantic-release"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  publish-release-archives:
    name: publish-release-archives (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs:
      - release
      - build
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: write
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/

      - name: Package release archive
        run: |
          chmod +x dist/mcp-server_linux_${{ matrix.arch }} dist/validate_linux_${{ matrix.arch }}
          make package-release-archive \
            VERSION="${{ needs.release.outputs.git_tag }}" \
            ARCH=${{ matrix.arch }}

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.git_tag }}" \
            dist/make-mcp_${{ needs.release.outputs.git_tag }}_linux_${{ matrix.arch }}.tar.gz \
            --clobber

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "publish-release-archives (${{ matrix.arch }})"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  publish-container:
    name: publish-container
    runs-on: ubuntu-latest
    needs:
      - release
      - build
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download container tars
        uses: actions/download-artifact@v4
        with:
          pattern: container-*
          path: dist/
          merge-multiple: true

      - name: Load and push arch images
        env:
          GIT_TAG: ${{ needs.release.outputs.git_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/make-mcp"
          short_sha="${GIT_SHA:0:7}"
          for arch in amd64 arm64; do
            docker load -i "dist/make-mcp_ci-${GIT_SHA}_linux_${arch}.tar"
            docker tag "${image}:ci-${GIT_SHA}" "${image}:${GIT_TAG}-${arch}"
            docker tag "${image}:ci-${GIT_SHA}" "${image}:${short_sha}-${arch}"
            docker push "${image}:${GIT_TAG}-${arch}"
            docker push "${image}:${short_sha}-${arch}"
          done

      - name: Create and push multi-arch manifest
        env:
          GIT_TAG: ${{ needs.release.outputs.git_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/make-mcp"
          short_sha="${GIT_SHA:0:7}"
          docker buildx imagetools create \
            -t "${image}:${GIT_TAG}" \
            -t "${image}:${short_sha}" \
            -t "${image}:latest" \
            "${image}:${GIT_TAG}-amd64" \
            "${image}:${GIT_TAG}-arm64"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "publish-container"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  semantic-release:
    name: semantic-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      git_tag: ${{ steps.version.outputs.git_tag }}
      sem_ver: ${{ steps.version.outputs.sem_ver }}
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create semantic version tag and GitHub release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

      - name: Detect created tag
        id: version
        run: |
          # @semantic-release/git pushes a changelog commit after the tag is
          # created, so the tag points at that child commit, not GITHUB_SHA.
          # Fetch tags and the current state of main so FETCH_HEAD == the
          # changelog commit; fall back to GITHUB_SHA if none was pushed.
          git fetch --tags origin main
          git_tag="$(git tag --points-at FETCH_HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "${git_tag}" ]; then
            git_tag="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          fi
          if [ -n "${git_tag}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "git_tag=${git_tag}" >> "$GITHUB_OUTPUT"
            echo "sem_ver=${git_tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "git_tag=" >> "$GITHUB_OUTPUT"
            echo "sem_ver=" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: failure() || steps.version.outputs.released == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "semantic-release"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  build-image-amd64:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      arch: amd64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

  build-image-arm64:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      arch: arm64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

  build-release-amd64:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_build-release.yml
    with:
      arch: amd64
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  build-release-arm64:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_build-release.yml
    with:
      arch: arm64
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  sbom-and-scan:
    needs:
      [
        semantic-release,
        build-image-amd64,
        build-image-arm64,
        build-release-amd64,
        build-release-arm64,
      ]
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_sbom-and-scan.yml
    permissions:
      contents: write
    with:
      git-tag: ${{ needs.semantic-release.outputs.git_tag }}
      repository-owner: ${{ github.repository_owner }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  smoke-tests-binary-amd64:
    needs: [semantic-release, build-release-amd64]
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_smoke-tests-binary.yml
    with:
      arch: amd64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  smoke-tests-container-amd64:
    needs: [semantic-release, build-image-amd64]
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_smoke-tests-container.yml
    with:
      arch: amd64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  smoke-tests-binary-arm64:
    needs: [semantic-release, build-release-arm64]
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_smoke-tests-binary.yml
    with:
      arch: arm64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  smoke-tests-container-arm64:
    needs: [semantic-release, build-image-arm64]
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_smoke-tests-container.yml
    with:
      arch: arm64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  compatibility-tests-binary-amd64:
    needs: [semantic-release, build-release-amd64]
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_compatibility-tests-binary.yml
    with:
      arch: amd64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  compatibility-tests-container-amd64:
    needs: [semantic-release, build-image-amd64]
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_compatibility-tests-container.yml
    with:
      arch: amd64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  compatibility-tests-binary-arm64:
    needs: [semantic-release, build-release-arm64]
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_compatibility-tests-binary.yml
    with:
      arch: arm64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  compatibility-tests-container-arm64:
    needs: [semantic-release, build-image-arm64]
    if: needs.semantic-release.outputs.released == 'true'
    uses: ./.github/workflows/_compatibility-tests-container.yml
    with:
      arch: arm64
      image-tag: ${{ needs.semantic-release.outputs.git_tag }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  release-binaries:
    needs:
      [
        semantic-release,
        sbom-and-scan,
        smoke-tests-binary-amd64,
        smoke-tests-container-amd64,
        smoke-tests-binary-arm64,
        smoke-tests-container-arm64,
        compatibility-tests-binary-amd64,
        compatibility-tests-container-amd64,
        compatibility-tests-binary-arm64,
        compatibility-tests-container-arm64,
      ]
    name: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/

      - name: Package release archive
        env:
          GIT_TAG: ${{ needs.semantic-release.outputs.git_tag }}
        run: |
          chmod +x dist/make-mcp_linux_${{ matrix.arch }} dist/make-mcp-validate_linux_${{ matrix.arch }}
          make package-release-archive \
            VERSION="${GIT_TAG}" \
            ARCH=${{ matrix.arch }}

          cd dist/
          sha256sum "make-mcp_${GIT_TAG}_linux_${{ matrix.arch }}.tar.gz" > "make-mcp_${GIT_TAG}_linux_${{ matrix.arch }}.sha256"

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.semantic-release.outputs.git_tag }}
        run: |
          gh release upload "${GIT_TAG}" \
            dist/make-mcp_${GIT_TAG}_linux_${{ matrix.arch }}.tar.gz \
            dist/make-mcp_${GIT_TAG}_linux_${{ matrix.arch }}.sha256 \
            --clobber

      - name: Notify Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "release-binaries (${{ matrix.arch }})"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  release-containers:
    needs:
      [
        semantic-release,
        sbom-and-scan,
        smoke-tests-binary-amd64,
        smoke-tests-container-amd64,
        smoke-tests-binary-arm64,
        smoke-tests-container-arm64,
        compatibility-tests-binary-amd64,
        compatibility-tests-container-amd64,
        compatibility-tests-binary-arm64,
        compatibility-tests-container-arm64,
      ]
    name: release-containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download container tars
        uses: actions/download-artifact@v4
        with:
          pattern: container-*
          path: dist/
          merge-multiple: true

      - name: Load, push, and create multi-arch manifest
        env:
          GIT_TAG: ${{ needs.semantic-release.outputs.git_tag }}
          SEM_VER: ${{ needs.semantic-release.outputs.sem_ver }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/make-mcp"
          short_sha="${GIT_SHA:0:7}"

          # Load each arch image and push under the version tag, capturing the
          # per-arch digest. The second push overwrites the tag locally but both
          # manifests remain content-addressed in the registry by digest.
          declare -A digest
          for arch in amd64 arm64; do
            docker load -i "dist/make-mcp_${GIT_TAG}_linux_${arch}.tar"
            digest[$arch]=$(docker push "${image}:${GIT_TAG}" | grep -oP 'digest: \K\S+')
          done

          # Create the multi-arch manifest and retag :GIT_TAG to point at it,
          # so all tags are multi-arch indexes with no leftover single-arch tags.
          docker buildx imagetools create \
            -t "${image}:${GIT_TAG}" \
            -t "${image}:${short_sha}" \
            -t "${image}:${SEM_VER}" \
            -t "${image}:latest" \
            "${image}@${digest[amd64]}" \
            "${image}@${digest[arm64]}"

      - name: Notify Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "release-containers"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  pull-test-containers:
    needs: [semantic-release, release-containers]
    name: pull-test-containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Pull and Smoke Test
        env:
          GIT_TAG: ${{ needs.semantic-release.outputs.git_tag }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/make-mcp:${GIT_TAG}"
          docker pull "${image}"
          make smoke-test-container ARCH=${{ matrix.arch }} IMAGE_TAG="${GIT_TAG}"

      - name: Notify Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "pull-test-containers (${{ matrix.arch }})"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  install-test-releases:
    needs: [semantic-release, release-binaries]
    name: install-test-releases
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release archive from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.semantic-release.outputs.git_tag }}
        run: |
          gh release download "${GIT_TAG}" \
            --pattern "make-mcp_${GIT_TAG}_linux_${{ matrix.arch }}.tar.gz" \
            --dir dist/

      - name: Extract and Smoke Test
        env:
          GIT_TAG: ${{ needs.semantic-release.outputs.git_tag }}
        run: |
          tar -xzf "dist/make-mcp_${GIT_TAG}_linux_${{ matrix.arch }}.tar.gz" -C dist/
          cp "dist/make-mcp_${GIT_TAG}_linux_${{ matrix.arch }}/make-mcp" dist/make-mcp
          cp "dist/make-mcp_${GIT_TAG}_linux_${{ matrix.arch }}/make-mcp-validate" dist/make-mcp-validate
          make test-binary ARCH=${{ matrix.arch }}

      - name: Notify Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "install-test-releases (${{ matrix.arch }})"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  publish-wiki:
    name: publish-wiki
    needs: [install-test-releases, pull-test-containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git clone "${wiki_url}" wiki-pub
          cp wiki/*.md wiki-pub/
          cp -r wiki/images wiki-pub/
          cd wiki-pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet \
            && echo "wiki already up to date" \
            || git commit -m "chore(wiki): sync from main [skip ci]"
          git push

  notify-release-success:
    needs:
      [
        semantic-release,
        pull-test-containers,
        install-test-releases,
        publish-wiki,
      ]
    if: success() && needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "Release Published (${{ needs.semantic-release.outputs.git_tag }})"
          JOB_STATUS: "success"
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

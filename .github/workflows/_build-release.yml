name: _build-release

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  build:
    name: build-releases (${{ inputs.arch }})
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: make build-binaries ARCH=${{ inputs.arch }}

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ inputs.arch }}
          path: dist/*_linux_${{ inputs.arch }}
          if-no-files-found: error
          retention-days: 7

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "build-releases (${{ inputs.arch }})"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

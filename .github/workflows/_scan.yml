name: _scan

on:
  workflow_call:
    inputs:
      skip-trivy:
        description: "Skip Trivy vulnerability scan"
        type: boolean
        default: false
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  trufflehog:
    name: scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

      - name: Notify Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "scan (TruffleHog)"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh

  trivy:
    name: scan (Trivy)
    if: inputs.skip-trivy != true
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

      - name: Notify Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: "scan (Trivy)"
          JOB_STATUS: ${{ job.status }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./.github/scripts/notify-discord.sh
